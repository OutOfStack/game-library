kind: Deployment
apiVersion: apps/v1
metadata:
    name: game-library-deployment
    namespace: game-library
    labels:
        app: game-library
spec:
    replicas: 2
    strategy:
        # use this because of error "1 node(s) didn't have free ports for the requested pod ports"
        type: Recreate
    selector:
        matchLabels:
            app: game-library
    template:
        metadata:
            labels:
                app: game-library
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/path: "/metrics"
                prometheus.io/port: "8000"
        spec:
            containers:
              - name: game-library
                image: asctod/game-library:_IMAGE_TAG_
                readinessProbe:
                    httpGet:
                        path: /api/readiness
                        port: 8000
                    initialDelaySeconds: 10
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 2
                livenessProbe:
                    httpGet:
                        path: /api/liveness
                        port: 8000
                    initialDelaySeconds: 10
                    periodSeconds: 30
                    timeoutSeconds: 2
                    failureThreshold: 2
                ports:
                  - name: api
                    containerPort: 8000
                  - name: debug
                    containerPort: 6060
                  - name: grpc
                    containerPort: 9000
                env:
                  - name: KUBERNETES_NAMESPACE
                    valueFrom:
                        fieldRef:
                            fieldPath: metadata.namespace
                  - name: KUBERNETES_PODNAME
                    valueFrom:
                        fieldRef:
                            fieldPath: metadata.name
                  - name: KUBERNETES_PODIP
                    valueFrom:
                        fieldRef:
                            fieldPath: status.podIP
                  - name: KUBERNETES_NODENAME
                    valueFrom:
                        fieldRef:
                            fieldPath: spec.nodeName
                envFrom:
                  - secretRef:
                        name: game-library-dbconfig
                  - secretRef:
                        name: game-library-igdb
                  - secretRef:
                        name: game-library-s3
                  - configMapRef:
                        name: game-library-config
                imagePullPolicy: Always
            hostAliases:
              - ip: _K8S_IP_
                hostnames:
                  - _K8S_URL_
---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: game-library-worker-deployment
    namespace: game-library
    labels:
        app: game-library-worker
spec:
    replicas: 2
    strategy:
        # avoid running scheduled tasks in two pods at once during rollout
        type: Recreate
    selector:
        matchLabels:
            app: game-library-worker
    template:
        metadata:
            labels:
                app: game-library-worker
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/path: "/metrics"
                prometheus.io/port: "8001"
        spec:
            containers:
              - name: game-library-worker
                image: asctod/game-library:_IMAGE_TAG_
                command: ["./game-library-worker"]
                ports:
                  - name: metrics
                    containerPort: 8001
                env:
                  - name: APP_HTTP_ADDRESS
                    value: "0.0.0.0:8001"
                  - name: KUBERNETES_NAMESPACE
                    valueFrom:
                        fieldRef:
                            fieldPath: metadata.namespace
                  - name: KUBERNETES_PODNAME
                    valueFrom:
                        fieldRef:
                            fieldPath: metadata.name
                  - name: KUBERNETES_PODIP
                    valueFrom:
                        fieldRef:
                            fieldPath: status.podIP
                  - name: KUBERNETES_NODENAME
                    valueFrom:
                        fieldRef:
                            fieldPath: spec.nodeName
                envFrom:
                  - secretRef:
                        name: game-library-dbconfig
                  - secretRef:
                        name: game-library-igdb
                  - secretRef:
                        name: game-library-s3
                  - secretRef:
                        name: game-library-openai
                  - configMapRef:
                        name: game-library-config
                imagePullPolicy: Always
---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: redis-deployment
    namespace: game-library
    labels:
        app: redis
spec:
    replicas: 1
    selector:
        matchLabels:
            app: redis
    template:
        metadata:
            labels:
                app: redis
        spec:
            containers:
              - name: redis
                image: redis:8.10-alpine3.23
                ports:
                  - name: redis
                    containerPort: 6379
            hostAliases:
              - ip: _K8S_IP_
                hostnames:
                  - _K8S_URL_
